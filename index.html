<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#080b18">

<title>QueryX | Secure Portal</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#fff;
    background:#070a16;
    overflow-x:hidden;
}

/* Animated wallpaper */
body:before,
body:after{
    content:"";
    position:fixed;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(90px);
    opacity:.30;
    pointer-events:none;
    z-index:-2;
}

body:before{
    background:#4f46e5;
    top:-100px;
    left:-100px;
    animation:float1 10s infinite alternate ease-in-out;
}

body:after{
    background:#9333ea;
    right:-120px;
    bottom:-100px;
    animation:float2 12s infinite alternate ease-in-out;
}

@keyframes float1{
    from{transform:translate(0,0)}
    to{transform:translate(130px,120px)}
}

@keyframes float2{
    from{transform:translate(0,0)}
    to{transform:translate(-130px,-100px)}
}

/* Header */
header{
    position:sticky;
    top:0;
    z-index:1000;
    height:64px;
    padding:10px 15px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(7,10,22,.78);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border-bottom:1px solid rgba(255,255,255,.08);
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brandIcon{
    width:40px;
    height:40px;
    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(135deg,#6366f1,#a855f7);
    box-shadow:0 0 25px rgba(99,102,241,.35);
    font-size:20px;
}

.brandName{
    font-size:16px;
    font-weight:800;
}

.brandSub{
    color:#8b95aa;
    font-size:9px;
}

.userBox{
    max-width:145px;
    text-align:right;
    font-size:11px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.logout{
    color:#a5b4fc;
    text-decoration:none;
    font-size:10px;
}

/* Main */
main{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:18px 13px 50px;
}

/* Hero */
.hero{
    margin:5px 2px 17px;
}

.hero h1{
    margin:0;
    font-size:27px;
    background:linear-gradient(90deg,#fff,#a5b4fc,#e9d5ff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.hero p{
    margin:6px 0 0;
    color:#8b95aa;
    font-size:12px;
}

/* Cards */
.card{
    position:relative;
    padding:16px;
    margin-bottom:13px;

    border-radius:20px;

    background:linear-gradient(
        145deg,
        rgba(255,255,255,.085),
        rgba(255,255,255,.025)
    );

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 15px 45px rgba(0,0,0,.25),
        inset 0 1px rgba(255,255,255,.04);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    animation:cardIn .35s ease;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Inputs */
input,
textarea{
    width:100%;
    border:1px solid rgba(255,255,255,.10);
    outline:none;

    background:rgba(0,0,0,.20);
    color:#fff;

    border-radius:12px;
    padding:12px;

    font-family:inherit;
    font-size:14px;

    margin-top:7px;

    transition:.2s;
}

textarea{
    resize:vertical;
    min-height:90px;
}

input::placeholder,
textarea::placeholder{
    color:#667085;
}

input:focus,
textarea:focus{
    border-color:#6366f1;
    box-shadow:0 0 0 3px rgba(99,102,241,.12);
}

/* Buttons */
button{
    width:100%;
    border:0;
    outline:none;

    padding:12px 14px;
    margin-top:9px;

    border-radius:13px;

    color:white;
    font-weight:700;
    font-size:14px;

    cursor:pointer;

    background:linear-gradient(135deg,#6366f1,#7c3aed);

    box-shadow:0 8px 25px rgba(99,102,241,.20);

    transition:.15s;
}

button:active{

}

button:hover{

}

.btnGreen{
    background:linear-gradient(135deg,#16a34a,#059669);
}

.btnRed{
    background:linear-gradient(135deg,#ef4444,#dc2626);
}

.btnGray{
    background:rgba(255,255,255,.08);
    box-shadow:none;
}

.btnOrange{
    background:linear-gradient(135deg,#f59e0b,#ea580c);
}

/* Search */
.searchBox{
    position:relative;
    margin-bottom:15px;
}

.searchIcon{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);

}

.searchInput{

    padding-left:42px;

    justify-content:space-between;

.ownerIcon{

.ownerTitle{

.ownerSub{

/* Query */
.queryCard{

.queryCard:hover{
    transform:translateY(-2px);

.queryTop{

.status{

.queryText{

    line-height:1.5;

.queryUser{

/* QR */
.qrContainer{
    text-align:center;

.qr{

    width:100%;

    margin:13px auto;

    border-radius:17px;

/* Success */
.success{

/* Empty */

/* Login */
.loginCard{

.loginIcon{

    height:75px;

    align-items:center;

    background:linear-gradient(135deg,#6366f1,#a855f7);

.loginCard h2{

/* Info */
.info{

    border-radius:12px;
    background:rgba(255,255,255,.04);
    color:#8d97aa;

    line-height:1.5;

/* Mobile */
@media(max-width:480px){

        max-width:120px;

<script>

/* =========================================================

const firebaseConfig = {

firebase.initializeApp(firebaseConfig);

/* =========================================================

const STATUS = {

};


/* =========================================================
   ESCAPE
========================================================= */

function esc(value){

    return String(value || "")
        .replace(/[&<>"]/g,function(c){
            return {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;"
            }[c];
        });
}


/* =========================================================
   FILE PICKER
========================================================= */

function pickImage(){

    return new Promise(function(resolve){

        const input =
            document.createElement("input");

        input.type = "file";
        input.accept = "image/*";

        input.onchange = function(){

            resolve(
                input.files &&
                input.files[0]
                ? input.files[0]
                : null
            );

        };

        input.click();

    });
}


/* =========================================================
   IMAGE COMPRESS
========================================================= */

function compressImage(file,maxSize=900){

    return new Promise(function(resolve,reject){

        const reader =
            new FileReader();

        reader.onload = function(){

            const img =
                new Image();

            img.onload = function(){

                const ratio =
                    Math.min(
                        1,
                        maxSize /
                        Math.max(
                            img.width,
                            img.height
                        )
                    );

                const canvas =
                    document.createElement("canvas");

                canvas.width =
                    Math.max(
                        1,
                        Math.round(
                            img.width * ratio
                        )
                    );

                canvas.height =
                    Math.max(
                        1,
                        Math.round(
                            img.height * ratio
                        )
                    );

                const ctx =
                    canvas.getContext("2d");

                ctx.drawImage(
                    img,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                resolve(
                    canvas.toDataURL(
                        "image/jpeg",
                        .65
                    )
                );

            };

            img.onerror = reject;

            img.src = reader.result;

        };

        reader.onerror = reject;

        reader.readAsDataURL(file);

    });
}


/* =========================================================
   AUTH
========================================================= */

auth.onAuthStateChanged(function(u){

    user = u;

    isOwner =

        OWNER_EMAILS.includes(

});


/* =========================================================
   CLEANUP
========================================================= */

function clearAllListeners(){

    if(mainUnsub){

        mainUnsub = null;
    }

    if(queryUnsub){
        queryUnsub();
        queryUnsub = null;
    }

    clearInterval(timerInterval);
    timerInterval = null;
}


/* =========================================================
   LOGIN
========================================================= */

function showLogin(){

}

}


/* =========================================================
   HOME
========================================================= */

function showHome(){

    clearAllListeners();

    let html = `

        <div class="hero">

            <h1>
                ${
                    isOwner
                    ? "Owner Dashboard"
                    : "Welcome Back"
                }
            </h1>

            <p>
                ${
                    isOwner
                    ? "Manage queries, payments and QR codes."
                    : "Manage your query and payment status."
                }
            </p>

        </div>

    `;


    if(isOwner){

        html += `

            <div class="ownerBanner">

                <div class="ownerIcon">
                    👑
                </div>

                <div>

                    <div class="ownerTitle">
                        Owner Panel
                    </div>

                    <div class="ownerSub">
                        Administrator access enabled
                    </div>

                </div>

            </div>


            <div class="card">

                <div class="sectionHeader">
                    <b>Add New Query</b>
                    <span class="muted">Owner</span>
                </div>

                <textarea
                    id="ownerQuery"
                    placeholder="Write a new query..."
                ></textarea>

                <button onclick="ownerAddQuery()">
                    Add Query
                </button>

            </div>

        `;

    }else{

        html += `

            <div class="card">

                <div class="sectionHeader">
                    <b>Send New Query</b>
                </div>

                <textarea
                    id="userQuery"
                    placeholder="Describe your problem or query..."
                ></textarea>

                <button onclick="userAddQuery()">
                    Send Query
                </button>

            </div>

        `;

    }


    html += `

        <div class="searchBox">

            <span class="searchIcon">
                🔎
            </span>

            <input
                id="searchInput"
                class="searchInput"
                placeholder="Search queries..."
                oninput="renderQueries()"
            >

        </div>


        <div class="sectionHeader">

            <b>
                ${isOwner ? "All Queries" : "My Queries"}
            </b>

            <span
                id="queryCount"
                class="muted"
            >
                0 queries
            </span>

        </div>


        <div id="queryList">
            Loading...
        </div>

    `;


    app.innerHTML = html;


    loadQueries();

}


/* =========================================================
   LOAD QUERIES
========================================================= */

function loadQueries(){

    let ref;

    if(isOwner){

        ref =
            db.collection("queries")
              .orderBy(
                  "created",
                  "desc"
              );

    }else{

        ref =
            db.collection("queries")
              .where(
                  "uid",
                  "==",
                  user.uid
              );

    }


    mainUnsub =
        ref.onSnapshot(
            function(snapshot){

                currentQueries =
                    snapshot.docs.map(
                        function(doc){

                            return {
                                id:doc.id,
                                ...doc.data()
                            };

                        }
                    );


                currentQueries.sort(
                    function(a,b){

                        const aTime =
                            a.created &&
                            a.created.seconds
                            ? a.created.seconds
                            : 0;

                        const bTime =
                            b.created &&
                            b.created.seconds
                            ? b.created.seconds
                            : 0;

                        return bTime-aTime;

                    }
                );


                renderQueries();

            },
            function(error){

                console.error(error);

                const list =
                    document.getElementById(
                        "queryList"
                    );

                if(list){

                    list.innerHTML = `
                        <div class="card empty">
                            Unable to load queries.
                        </div>
                    `;

                }

            }
        );

}


/* =========================================================
   RENDER
========================================================= */

function renderQueries(){

    const list =
        document.getElementById(
            "queryList"
        );

    if(!list) return;


    const searchInput =
        document.getElementById(
            "searchInput"
        );

    const search =
        searchInput
        ? searchInput.value
            .trim()
            .toLowerCase()
        : "";


    const filtered =
        currentQueries.filter(
            function(q){

                const content =
                    (
                        (q.text || "") +
                        " " +
                        (q.name || "") +
                        " " +
                        (q.email || "") +
                        " " +
                        (STATUS[q.status] || "")
                    ).toLowerCase();

                return content.includes(search);

            }
        );


    const count =
        document.getElementById(
            "queryCount"
        );

    if(count){

        count.textContent =
            filtered.length +
            (
                filtered.length === 1
                ? " query"
                : " queries"
            );

    }


    if(!filtered.length){

        list.innerHTML = `
            <div class="card empty">
                ${
                    search
                    ? "No matching queries found."
                    : "No queries available."
                }
            </div>
        `;

        return;
    }


    list.innerHTML =
        filtered.map(function(q){

            return `

                <div
                    class="card queryCard"
                    onclick="openQuery('${q.id}')"
                >

                    <div class="queryTop">

                        <span class="status">
                            ${
                                q.status === "done"
                                ? "✓"
                                : q.status === "review"
                                ? "◷"
                                : q.status === "replied"
                                ? "₹"
                                : "•"
                            }

                            ${esc(
                                STATUS[q.status] ||
                                "New Query"
                            )}
                        </span>

                        <span class="muted">
                            Open ›
                        </span>

                    </div>

                    <div class="queryText">
                        ${esc(q.text)}
                    </div>

                    ${
                        isOwner
                        ?
                        `
                        <div class="queryUser">
                            User: ${esc(
                                q.name ||
                                q.email ||
                                "Unknown User"
                            )}
                        </div>
                        `
                        :
                        ""
                    }

                </div>

            `;

        }).join("");

}


/* =========================================================
   OWNER ADD QUERY
========================================================= */

async function ownerAddQuery(){

    const input =
        document.getElementById(
            "ownerQuery"
        );

    if(!input) return;

    const text =
        input.value.trim();

    if(!text){

        alert(
            "Please enter a query."
        );

        return;
    }


    try{

        await db.collection(
            "queries"
        ).add({

            uid:user.uid,

            name:"Owner",

            email:user.email,

            text:text,

            status:"new",

            created:
                firebase.firestore
                .FieldValue
                .serverTimestamp()

        });


        input.value = "";

    }catch(error){

        alert(
            "Unable to add query: " +
            error.message
        );

    }

}

        input.value = "";

    }catch(error){

        alert(

        );

    }

}


/* =========================================================
   DELETE QUERY
========================================================= */

async function deleteQuery(id){

    if(!isOwner) return;


    const yes =
        confirm(
            "Are you sure you want to delete this query?"
        );


    if(!yes) return;


    try{

        await db.doc(
            "queries/" + id
        ).delete();


        showHome();

    }catch(error){

        alert(
            "Unable to delete query: " +
            error.message
        );

    }

}


/* =========================================================
   OPEN QUERY
========================================================= */

function openQuery(id){

    currentQueryId = id;

    if(mainUnsub){

        mainUnsub();
        mainUnsub = null;

    }

    if(queryUnsub){

        queryUnsub();
        queryUnsub = null;

    }


    clearInterval(timerInterval);
    timerInterval = null;


    app.innerHTML = `

        <button
            class="btnGray"
            style="width:auto;margin-bottom:12px"
            onclick="showHome()"
        >
            ← Back
        </button>

        <div id="queryPage">
            Loading...
        </div>

    `;


    queryUnsub =
        db.doc(
            "queries/" + id
        ).onSnapshot(
            async function(snapshot){

                if(!snapshot.exists){

                    app.innerHTML = `

                        <div class="card empty">
                            This query no longer exists.
                        </div>

                    `;

                    return;

                }


                const q =
                    snapshot.data();


                renderQueryPage(
                    id,
                    q
                );

            },
            function(error){

                console.error(error);

                const page =
                    document.getElementById(
                        "queryPage"
                    );

                if(page){

                    page.innerHTML = `
                        <div class="card empty">
                            Unable to load this query.
                        </div>
                    `;

                }

            }
        );

}


/* =========================================================
   QUERY PAGE
========================================================= */

async function renderQueryPage(
    id,
    q
){

    const page =
        document.getElementById(
            "queryPage"
        );

    if(!page) return;


    clearInterval(timerInterval);


    let qrData = null;


    /*
       QR IS STORED INSIDE THE QUERY.
       Therefore every query has its own QR
       and its own expiry timer.
    */

    if(
        q.qr &&
        q.qrExpiresAt
    ){

        const expiry =
            q.qrExpiresAt.toMillis();


        if(
            Date.now() < expiry
        ){

            qrData = {
                image:q.qr,
                expiry:expiry
            };

        }

    }


    page.innerHTML = `

        <div class="card">

            <div class="queryTop">

                <span class="status">
                    ${
                        q.status === "done"
                        ? "✓"
                        : q.status === "review"
                        ? "◷"
                        : q.status === "replied"
                        ? "₹"
                        : "•"
                    }

                    ${esc(
                        STATUS[q.status] ||
                        "New Query"
                    )}
                </span>

                ${
                    isOwner
                    ?
                    `
                    <span
                        class="muted"
                    >
                        Owner View
                    </span>
                    `
                    :
                    ""
                }

            </div>


            <div class="queryText">
                ${esc(q.text)}
            </div>


            ${
                isOwner
                ?
                `
                <div class="queryUser">
                    User:
                    ${esc(
                        q.name ||
                        q.email ||
                        "Unknown"
                    )}
                </div>
                `
                :
                ""
            }

        </div>


        ${
            q.reply
            ?
            `
            <div class="card">

                <div class="sectionHeader">
                    <b>Owner Reply</b>
                </div>

                <div class="queryText">
                    ${esc(q.reply)}
                </div>

                ${
                    q.link
                    ?
                    `
                    <a
                        href="${esc(q.link)}"
                        target="_blank"
                        style="
                            color:#a5b4fc;
                            text-decoration:none;
                            font-size:13px;
                        "
                    >
                        Open Recording / Link
                    </a>
                    `
                    :
                    ""
                }


                ${
                    q.amount
                    ?
                    `
                    <div
                        style="
                            margin-top:12px;
                            color:#86efac;
                            font-weight:800;
                        "
                    >
                        Payment Amount:
                        ₹${esc(
                            String(q.amount)
                        )}
                    </div>
                    `
                    :
                    ""
                }

            </div>
            `
            :
            ""
        }


        ${
            isOwner
            ?
            ownerQueryPanel(id,q)
            :
            userQueryPanel(id,q,qrData)
        }

    `;


    /*
       Start timer after rendering.
       It uses the Firestore timestamp,
       so refresh does NOT restart it.
    */

    if(qrData){

        startTimer(
            id,
            qrData.expiry
        );

    }

}


/* =========================================================
   OWNER QUERY PANEL
========================================================= */

function ownerQueryPanel(id,q){

    if(
        q.status === "new" ||
        q.status === "replied"
    ){

        return `

            <div class="card">

                <div class="sectionHeader">
                    <b>
                        Reply & Payment
                    </b>
                </div>


                <textarea
                    id="replyInput"
                    placeholder="Write your reply..."
                >${esc(
                    q.reply || ""
                )}</textarea>


                <input
                    id="linkInput"
                    placeholder="Recording / Link"
                    value="${esc(
                        q.link || ""
                    )}"
                >


                <input
                    id="amountInput"
                    type="number"
                    placeholder="Payment Amount"
                    value="${esc(
                        q.amount || ""
                    )}"
                >


                <button
                    onclick="
                        sendReply('${id}')
                    "
                >
                    Save Reply & Payment
                </button>


                <button
                    class="btnRed"
                    onclick="
                        deleteQuery('${id}')
                    "
                >
                    Delete Query
                </button>

            </div>


            ${
                q.status === "replied"
                ?
                ownerQrPanel(id,q)
                :
                ""
            }

        `;

    }


    if(q.status === "review"){

        return `

            <div class="card">

                <div class="sectionHeader">
                    <b>
                        Payment Screenshot
                    </b>
                </div>


                ${
                    q.paymentScreenshot
                    ?
                    `
                    <img
                        class="qr"
                        src="${esc(
                            q.paymentScreenshot
                        )}"
                    >
                    `
                    :
                    `
                    <div class="info">
                        No screenshot uploaded.
                    </div>
                    `
                }


                <button
                    class="btnGreen"
                    onclick="
                        confirmPayment('${id}')
                    "
                >
                    Confirm Payment
                </button>


                <button
                    class="btnRed"
                    onclick="
                        deleteQuery('${id}')
                    "
                >
                    Delete Query
                </button>

            </div>

        `;

    }


    if(q.status === "done"){

        return `

            <div class="success">
                Payment confirmed.
                <br>
                The user has been notified that
                the query will be solved within 5 days.
            </div>

            <button
                class="btnRed"
                onclick="
                    deleteQuery('${id}')
                "
            >
                Delete Query
            </button>

        `;

    }


    return "";

}


/* =========================================================
   OWNER QR PANEL
========================================================= */

function ownerQrPanel(id,q){

    let active =
        q.qr &&
        q.qrExpiresAt &&
        q.qrExpiresAt.toMillis() > Date.now();


    return `

        <div class="card qrContainer">

            <div class="sectionHeader">
                <b>
                    Payment QR
                </b>

                <span class="muted">
                    2 minute timer
                </span>
            </div>


            ${
                active
                ?
                `
                <img
                    class="qr"
                    src="${esc(q.qr)}"
                >

                <div
                    id="ownerTimer"
                    class="timer"
                >
                    --:--
                </div>

                <div class="timerText">
                    QR will disappear automatically
                    when the timer ends.
                </div>
                `
                :
                `
                <div class="info">
                    No active QR for this query.
                </div>
                `
            }


            <button
                onclick="
                    uploadQueryQR('${id}')
                "
            >
                ${
                    active
                    ? "Change QR"
                    : "Upload QR"
                }
            </button>

        </div>

    `;

}


/* =========================================================
   USER QUERY PANEL
========================================================= */

function userQueryPanel(
    id,
    q,
    qrData
){

    if(q.status === "new"){

        return `

            <div class="card">

                <div class="info">
                    Your query has been received.
                    Please wait for the owner's reply.
                </div>

            </div>

        `;

    }


    if(q.status === "replied"){

        return `

            <div class="card qrContainer">

                <div class="sectionHeader">
                    <b>
                        Payment
                    </b>
                </div>


                ${
                    qrData
                    ?
                    `
                    <img
                        class="qr"
                        src="${esc(
                            qrData.image
                        )}"
                    >

                    <div
                        id="userTimer"
                        class="timer"
                    >
                        --:--
                    </div>

                    <div class="timerText">
                        QR expires automatically
                        when the timer reaches zero.
                    </div>
                    `
                    :
                    `
                    <div class="info">
                        The payment QR is currently
                        unavailable. Please wait for
                        the owner to activate it.
                    </div>
                    `
                }


                <button
                    class="btnGreen"
                    onclick="
                        paymentDone('${id}')
                    "
                >
                    Payment Done
                </button>

            </div>

        `;

    }


    if(q.status === "review"){

        return `

            <div class="card">

                <div class="info">
                    Payment screenshot uploaded
                    successfully.
                    <br><br>
                    Please wait while the owner
                    verifies your payment.
                </div>

            </div>

        `;

    }


    if(q.status === "done"){

        return `

            <div class="success">

                <b>Payment Confirmed</b>

                <br><br>

                Your payment has been confirmed.

                <br><br>

                <b>
                    Your query will be solved
                    within 5 days.
                </b>

            </div>

        `;

    }


    return "";

}


/* =========================================================
   UPLOAD QR FOR QUERY
========================================================= */

async function uploadQueryQR(id){

    if(!isOwner) return;


    const file =
        await pickImage();


    if(!file) return;


    try{

        const image =
            await compressImage(
                file,
                700
            );


        /*
           EXACTLY 2 MINUTES
        */

        const expiry =
            firebase.firestore
            .Timestamp.fromMillis(
                Date.now() + 120000
            );


        await db.doc(
            "queries/" + id
        ).update({

            qr:image,

            qrExpiresAt:expiry,

            status:"replied"

        });


    }catch(error){

        alert(
            "Unable to upload QR: " +
            error.message
        );

    }

}


/* =========================================================
   TIMER
========================================================= */

function startTimer(
    id,
    expiry
){

    clearInterval(timerInterval);


    function update(){

        /*
           IMPORTANT:
           Remaining time is calculated from
           the Firestore expiry timestamp.

           Therefore refreshing the page,
           changing tabs, or opening another
           query will NOT restart the timer.
        */

        const remaining =
            Math.max(
                0,
                expiry - Date.now()
            );


        const seconds =
            Math.ceil(
                remaining / 1000
            );


        const minutes =
            Math.floor(
                seconds / 60
            );


        const secs =
            seconds % 60;


        const formatted =
            minutes +
            ":" +
            String(secs)
                .padStart(2,"0");


        const userTimer =
            document.getElementById(
                "userTimer"
            );

        const ownerTimer =
            document.getElementById(
                "ownerTimer"
            );


        if(userTimer){

            userTimer.textContent =
                formatted;

        }


        if(ownerTimer){

            ownerTimer.textContent =
                formatted;

        }


        if(seconds <= 0){

            clearInterval(
                timerInterval
            );

            timerInterval = null;

            expireQueryQR(id);

        }

    }


    update();


    timerInterval =
        setInterval(
            update,
            1000
        );

}


/* =========================================================
   EXPIRE QR
========================================================= */

async function expireQueryQR(id){

    try{

        const ref =
            db.doc(
                "queries/" + id
            );


        const snap =
            await ref.get();


        if(!snap.exists) return;


        const q =
            snap.data();


        /*
           Only remove the QR if its stored
           expiry has actually passed.
        */

        if(
            q.qrExpiresAt &&
            q.qrExpiresAt.toMillis() <= Date.now()
        ){

            await ref.update({

                qr:
                    firebase.firestore
                    .FieldValue
                    .delete(),

                qrExpiresAt:
                    firebase.firestore
                    .FieldValue
                    .delete()

            });

        }

    }catch(error){

        console.error(
            "QR expiry error:",
            error
        );

    }

}


/* =========================================================
   PAYMENT DONE
========================================================= */

async function paymentDone(id){

    /*
       First ask user to upload screenshot.
    */

    const file =
        await pickImage();


    if(!file) return;


    try{

        const screenshot =
            await compressImage(
                file,
                1000
            );


        await db.doc(
            "queries/" + id
        ).update({

            paymentScreenshot:
                screenshot,

            status:"review"

        });


    }catch(error){

        alert(
            "Unable to upload screenshot: " +
            error.message
        );

    }

}


/* =========================================================
   SEND REPLY
========================================================= */

async function sendReply(id){

    const reply =
        document.getElementById(
            "replyInput"
        ).value.trim();


    const link =
        document.getElementById(
            "linkInput"
        ).value.trim();


    const amount =
        document.getElementById(
            "amountInput"
        ).value.trim();


    try{

        await db.doc(
            "queries/" + id
        ).update({

            reply:reply,

            link:link,

            amount:amount,

            status:"replied"

        });


        alert(
            "Reply saved successfully."
        );

    }catch(error){

        alert(
            "Unable to save reply: " +
            error.message
        );

    }

}


/* =========================================================
   CONFIRM PAYMENT
========================================================= */

async function confirmPayment(id){

    if(!isOwner) return;


    const yes =
        confirm(
            "Confirm this payment?"
        );


    if(!yes) return;


    try{

        await db.doc(
            "queries/" + id
        ).update({

            status:"done",

            paymentConfirmedAt:
                firebase.firestore
                .FieldValue
                .serverTimestamp()

        });

    }catch(error){

        alert(
            "Unable to confirm payment: " +
            error.message
        );

    }

}
